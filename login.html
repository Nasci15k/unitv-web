<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="supabase-url" content="https://figvurwbnocrzoupvtgs.supabase.co">
    <meta name="supabase-anon" content="sb_publishable_MRl6mB27qtXrDMyF9obwUg_vYtSNh7f">
    <title>Entrar — OpenTv | ICN Group</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e50914'/><text x='50' y='68' font-size='50' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'>OT</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{--accent:#e50914;--accent-soft:#ff3341;--bg:#0b0b0d;--bg2:#16161a;--bg3:#1d1d22;--text:#fff;--text2:rgba(255,255,255,.68);--text3:rgba(255,255,255,.4);--border:rgba(255,255,255,.09);--ok:#10b981;--err:#ef4444;--warn:#f59e0b;--font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
        html,body{height:100%}
        body{font-family:var(--font);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;
            background:
                radial-gradient(900px 520px at 50% -12%, rgba(229,9,20,.16), transparent 62%),
                radial-gradient(700px 480px at 88% 108%, rgba(229,9,20,.07), transparent 60%),
                radial-gradient(700px 480px at 8% 104%, rgba(90,40,255,.05), transparent 60%),
                var(--bg)}
        body::before{content:'';position:fixed;inset:0;pointer-events:none;background:
                repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);
            mix-blend-mode:overlay;opacity:.5}
        .card{position:relative;width:100%;max-width:408px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.018));border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:36px 30px 30px;overflow:hidden;
            box-shadow:0 34px 90px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.07);
            backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
            animation:cardIn .55s cubic-bezier(.2,.8,.2,1)}
        @keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
        .card::before{content:'';position:absolute;top:-1px;left:18%;right:18%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,80,90,.85),transparent)}
        .card::after{content:'';position:absolute;top:-130px;left:50%;transform:translateX(-50%);width:340px;height:230px;background:radial-gradient(closest-side,rgba(229,9,20,.28),transparent);pointer-events:none}
        .logo{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:8px;position:relative;z-index:1;flex-direction:column}
        .logo svg{width:42px;height:42px;filter:drop-shadow(0 0 20px rgba(229,9,20,.55))}
        .logo h1{font-size:27px;font-weight:900;letter-spacing:-.7px}
        .logo h1 span{color:var(--accent)}
        <img src="https://i.postimg.cc/RCX0WRvT/visro-a892f139c1a47f55793958530bddb41a.png" alt="ICN Group" class="login-brand-img" style="margin-top:6px;">
        .sub{text-align:center;color:var(--text3);font-size:13px;margin-bottom:24px;position:relative;z-index:1}
        .tabs{display:flex;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:13px;padding:5px;margin-bottom:24px;position:relative;z-index:1}
        .tab{flex:1;padding:11px 8px;border:none;background:none;color:var(--text3);font-family:var(--font);font-size:13.5px;font-weight:700;border-radius:9px;cursor:pointer;transition:all .25s}
        .tab:hover{color:var(--text2)}
        .tab.active{background:var(--accent-gradient,linear-gradient(120deg,#e50914,#ff3341));color:#fff;box-shadow:0 6px 18px rgba(229,9,20,.4)}
        form{display:flex;flex-direction:column;gap:13px;position:relative;z-index:1}
        .field label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:7px;letter-spacing:.2px}
        .field input{width:100%;padding:13px 15px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:var(--text);font-size:14.5px;font-family:var(--font);transition:all .22s}
        .field input:hover{border-color:rgba(255,255,255,.18)}
        .field input:focus{outline:none;border-color:var(--accent);background:rgba(255,255,255,.07);box-shadow:0 0 0 3px rgba(229,9,20,.18),0 0 24px rgba(229,9,20,.12)}
        .field input::placeholder{color:rgba(255,255,255,.3)}
        input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px #1d1d22 inset;-webkit-text-fill-color:#fff;caret-color:#fff;transition:background-color 9999s ease-out}
        .btn{margin-top:8px;padding:14px;background:linear-gradient(120deg,#e50914,#ff3341);border:none;border-radius:12px;color:#fff;font-size:14.5px;font-weight:800;letter-spacing:.2px;font-family:var(--font);cursor:pointer;transition:all .25s;box-shadow:0 10px 26px rgba(229,9,20,.34)}
        .btn:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(229,9,20,.46);filter:brightness(1.06)}
        .btn:active{transform:translateY(0)}
        .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
        .msg{display:none;padding:12px 14px;border-radius:11px;font-size:13px;line-height:1.45;margin-bottom:12px;position:relative;z-index:1}
        .msg.show{display:block}
        .msg.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
        .msg.ok{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:#6ee7b7}
        .msg.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);color:#fcd34d}
        .hidden{display:none!important}
        .back{display:block;text-align:center;margin-top:22px;color:var(--text3);font-size:13px;text-decoration:none;transition:color .2s;position:relative;z-index:1}
        .back:hover{color:var(--accent-soft)}
        .hint{text-align:center;margin-top:14px;font-size:11.5px;color:var(--text3);line-height:1.5;position:relative;z-index:1}
    </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 40 40" width="40" height="40"><rect width="40" height="40" rx="10" fill="url(#lg)"/><path d="M14 14 L20 20 L14 26" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M22 14 L28 20 L22 26" stroke="rgba(255,255,255,.45)" stroke-width="3" fill="none" stroke-linecap="round"/><defs><linearGradient id="lg" x1="0" y1="0" x2="40" y2="40"><stop offset="0%" stop-color="#e50914"/><stop offset="100%" stop-color="#ff3341"/></linearGradient></defs></svg>
    <h1>Open<span>Tv</span></h1>
    <span class="login-brand">ICN Group</span>
  </div>
  <p class="sub">Entre ou crie sua conta (aprovação necessária)</p>
  <div class="tabs">
    <button type="button" class="tab active" data-tab="signin">Entrar</button>
    <button type="button" class="tab" data-tab="signup">Criar conta</button>
  </div>
  <div id="msg" class="msg err" role="alert"></div>
  <form id="form-signin" novalidate>
    <div class="field"><label for="si-email">E-mail</label><input id="si-email" type="email" required autocomplete="username" placeholder="voce@email.com"></div>
    <div class="field"><label for="si-pass">Senha</label><input id="si-pass" type="password" required autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn" type="submit" id="btn-signin">Entrar</button>
    <button type="button" id="link-forgot" style="background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;font-family:var(--font);text-align:right;margin-top:-4px">Esqueci minha senha</button>
  </form>
  <form id="form-forgot" class="hidden" novalidate>
    <div class="field"><label for="fg-email">E-mail da sua conta</label><input id="fg-email" type="email" required autocomplete="email" placeholder="voce@email.com"></div>
    <button class="btn" type="submit" id="btn-forgot">Enviar link de redefinição</button>
    <button type="button" id="link-back-signin" style="background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;font-family:var(--font);text-align:center">← Voltar ao login</button>
  </form>
  <form id="form-newpass" class="hidden" novalidate>
    <input type="text" name="username" autocomplete="username" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <div class="field"><label for="np-pass">Nova senha (mín. 6)</label><input id="np-pass" type="password" required minlength="6" autocomplete="new-password" placeholder="••••••••"></div>
    <div class="field"><label for="np-pass2">Confirmar nova senha</label><input id="np-pass2" type="password" required minlength="6" autocomplete="new-password" placeholder="••••••••"></div>
    <button class="btn" type="submit" id="btn-newpass">Salvar nova senha</button>
  </form>
  <form id="form-signup" class="hidden" novalidate>
    <div class="field"><label for="su-name">Nome</label><input id="su-name" type="text" autocomplete="name" placeholder="Seu nome"></div>
    <div class="field"><label for="su-email">E-mail</label><input id="su-email" type="email" required autocomplete="username" placeholder="voce@email.com"></div>
    <div class="field"><label for="su-pass">Senha (mín. 6)</label><input id="su-pass" type="password" required minlength="6" autocomplete="new-password" placeholder="••••••••"></div>
    <div class="field"><label for="su-pass2">Confirmar senha</label><input id="su-pass2" type="password" required minlength="6" autocomplete="new-password" placeholder="••••••••"></div>
    <button class="btn" type="submit" id="btn-signup">Criar conta</button>
  </form>
  <a class="back" href="index.html">← Voltar ao player</a>
  <p class="hint" style="margin-top:10px"><a href="planos.html" style="color:var(--accent);text-decoration:none;font-weight:600">Ver planos</a> · <a href="landing.html" style="color:var(--text-3);text-decoration:none">Página inicial</a></p>
  <p class="hint" id="auth-mode-hint"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var tabs = document.querySelectorAll('.tab');
  var formSignin = $('form-signin');
  var formSignup = $('form-signup');
  var msgEl = $('msg');
  var btnSignin = $('btn-signin');
  var btnSignup = $('btn-signup');

  function flash(type, text) {
    msgEl.className = 'msg show ' + (type || 'err');
    msgEl.textContent = text || '';
  }
  function clearMsg() {
    msgEl.className = 'msg err';
    msgEl.textContent = '';
  }
  function setBusy(btn, on, label) {
    btn.disabled = !!on;
    btn.textContent = on ? 'Aguarde...' : label;
  }
  function switchTab(name) {
    tabs.forEach(function (t) {
      t.classList.toggle('active', t.dataset.tab === name);
    });
    formSignin.classList.toggle('hidden', name !== 'signin');
    formSignup.classList.toggle('hidden', name !== 'signup');
    $('form-forgot').classList.add('hidden');
    if (name !== 'recovery') $('form-newpass').classList.add('hidden');
    clearMsg();
  }
  function showForm(which) {
    tabs.forEach(function (t) { t.classList.remove('active'); });
    formSignin.classList.add('hidden');
    formSignup.classList.add('hidden');
    $('form-forgot').classList.add('hidden');
    $('form-newpass').classList.add('hidden');
    $(which).classList.remove('hidden');
    clearMsg();
  }
  function nextUrl() {
    try {
      var q = new URLSearchParams(location.search);
      var n = q.get('next');
      if (n && /^[\w./-]+$/.test(n)) return n;
    } catch (e) {}
    return 'index.html';
  }
  function afterLogin() {
    var st = AuthStore.getStatus();
    if (st === 'rejected') {
      flash('err', 'Sua conta foi recusada. Fale com o administrador.');
      AuthStore.signOut();
      setBusy(btnSignin, false, 'Entrar');
      return;
    }
    if (st === 'pending' && !AuthStore.isAdmin()) {
      flash('warn', 'Conta criada! Aguarde a aprovação de um administrador para usar o app.');
      setBusy(btnSignin, false, 'Entrar');
      return;
    }
    location.href = nextUrl();
  }

  tabs.forEach(function (t) {
    t.addEventListener('click', function () { switchTab(t.dataset.tab); });
  });

  // --- recuperação de senha ---
  var isRecovery = /type=recovery|#access_token=/.test(location.hash || '');
  $('link-forgot').addEventListener('click', function () {
    $('fg-email').value = $('si-email').value.trim();
    showForm('form-forgot');
  });
  $('link-back-signin').addEventListener('click', function () { switchTab('signin'); });
  $('form-forgot').addEventListener('submit', function (e) {
    e.preventDefault();
    clearMsg();
    var email = $('fg-email').value.trim();
    if (!email || email.indexOf('@') < 0) { flash('err', 'Informe um e-mail válido.'); return; }
    setBusy($('btn-forgot'), true, 'Enviando...');
    AuthStore.resetPassword(email).then(function () {
      flash('ok', 'Link enviado! Confira seu e-mail (e a caixa de spam) para redefinir a senha.');
      setBusy($('btn-forgot'), false, 'Enviar link de redefinição');
    }).catch(function (err) {
      flash('err', (err && err.message) || 'Não foi possível enviar o link.');
      setBusy($('btn-forgot'), false, 'Enviar link de redefinição');
    });
  });
  $('form-newpass').addEventListener('submit', function (e) {
    e.preventDefault();
    clearMsg();
    var p1 = $('np-pass').value, p2 = $('np-pass2').value;
    if (p1.length < 6) { flash('err', 'A senha precisa de pelo menos 6 caracteres.'); return; }
    if (p1 !== p2) { flash('err', 'As senhas não conferem.'); return; }
    setBusy($('btn-newpass'), true, 'Salvando...');
    AuthStore.updatePassword(p1).then(function () {
      flash('ok', 'Senha alterada com sucesso! Entrando...');
      setTimeout(function () { location.href = nextUrl(); }, 900);
    }).catch(function (err) {
      flash('err', (err && err.message) || 'Não foi possível alterar a senha.');
      setBusy($('btn-newpass'), false, 'Salvar nova senha');
    });
  });
  if (isRecovery) showForm('form-newpass');
  var qs = new URLSearchParams(location.search);
  var qTab = qs.get('tab');
  if (!isRecovery && (qTab === 'signup' || qs.get('signup') === '1' || qs.get('criar') === '1')) switchTab('signup');

  if (AuthStore.isDemo()) {
    $('auth-mode-hint').textContent = 'Modo demo local (Supabase offline).';
  }

  AuthStore.init().then(function () {
    if (isRecovery) return; // link de redefinição: deixa o form de nova senha aberto
    if (AuthStore.isAuthenticated()) {
      var st = AuthStore.getStatus();
      if (st === 'pending' && !AuthStore.isAdmin()) {
        flash('warn', 'Conta aguardando aprovação de um administrador.');
        return;
      }
      if (st === 'rejected') {
        flash('err', 'Conta recusada.');
        AuthStore.signOut();
        return;
      }
      location.href = nextUrl();
    }
  }).catch(function () {});

  formSignin.addEventListener('submit', function (e) {
    e.preventDefault();
    clearMsg();
    var email = $('si-email').value.trim();
    var pass = $('si-pass').value;
    if (!email || !pass) { flash('err', 'Preencha e-mail e senha.'); return; }
    setBusy(btnSignin, true, 'Entrar');
    AuthStore.signIn(email, pass)
      .then(function () { afterLogin(); })
      .catch(function (err) {
        flash('err', (err && err.message) || 'Falha ao entrar.');
        setBusy(btnSignin, false, 'Entrar');
      });
  });

  formSignup.addEventListener('submit', function (e) {
    e.preventDefault();
    clearMsg();
    var name = $('su-name').value.trim();
    var email = $('su-email').value.trim();
    var pass = $('su-pass').value;
    var pass2 = $('su-pass2').value;
    if (!email || !pass) { flash('err', 'Preencha e-mail e senha.'); return; }
    if (pass.length < 6) { flash('err', 'A senha precisa de pelo menos 6 caracteres.'); return; }
    if (pass !== pass2) { flash('err', 'As senhas não conferem.'); return; }
    setBusy(btnSignup, true, 'Criar conta');
    AuthStore.signUp(email, pass, name)
      .then(function (res) {
        if (res && res.needsConfirm) {
          flash('ok', 'Conta criada! Confirme o e-mail e depois faça login. Aguarde aprovação do admin.');
          switchTab('signin');
          setBusy(btnSignup, false, 'Criar conta');
          return;
        }
        var p = AuthStore.getProfile();
        if (p && p.status === 'pending') {
          flash('ok', 'Conta criada com sucesso! Aguarde a aprovação de um administrador.');
          switchTab('signin');
          setBusy(btnSignup, false, 'Criar conta');
          return;
        }
        flash('ok', 'Conta criada!');
        location.href = nextUrl();
      })
      .catch(function (err) {
        flash('err', (err && err.message) || 'Falha ao criar conta.');
        setBusy(btnSignup, false, 'Criar conta');
      });
  });
})();
</script>
</body>
</html>
