[build]
  publish = "."

[[edge_functions]]
  path = "/xtream-api/*"
  function = "xtream-api"

[[edge_functions]]
  path = "/xtream-stream/*"
  function = "xtream-stream"

# Proxy fallback (se edge function não rodar)
[[redirects]]
  from = "/xtream-api/*"
  to = "https://telefunplay.xyz/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/xtream-stream/*"
  to = "https://telefunplay.xyz/:splat"
  status = 200
  force = true

# SPA fallback (deve ser o último)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
