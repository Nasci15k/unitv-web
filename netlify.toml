[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[edge_functions]]
  path = "/xtream-api/*"
  function = "xtream-api"

[[edge_functions]]
  path = "/xtream-stream/*"
  function = "xtream-stream"

# Multi-fornecedor: rotas NOVAS por provedor (/xapi/{pid}, /xstr/{pid}).
# Sem redirect de fallback de proposito: falha da rota nova afeta APENAS
# provedores novos; o padrao segue no /xtream-api legado.
[[edge_functions]]
  path = "/xapi/*"
  function = "xapi"

[[edge_functions]]
  path = "/xstr/*"
  function = "xstr"

[[edge_functions]]
  path = "/status-all"
  function = "status-api"

[[edge_functions]]
  path = "/status-one"
  function = "status-api"

[[edge_functions]]
  path = "/status-report"
  function = "status-api"

[[edge_functions]]
  path = "/genres-all"
  function = "status-api"

[[edge_functions]]
  path = "/session-register"
  function = "sec-api"

[[edge_functions]]
  path = "/trial-activate"
  function = "sec-api"

[[edge_functions]]
  path = "/session-heartbeat"
  function = "sec-api"

[[edge_functions]]
  path = "/stats"
  function = "sec-api"

# Proxy fallback (se edge function não rodar)
[[redirects]]
  from = "/xtream-api/*"
  to = "https://telefunplay.xyz/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/xtream-stream/*"
  to = "https://telefunplay.xyz/:splat"
  status = 200
  force = true

# SPA fallback (deve ser o último)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
